<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresh Republic Panties</title>
  <script>
    (function () {
      var incomingParams = new URLSearchParams(window.location.search);
      var prettyUrl = "dailyessentials/panties/" + (incomingParams.toString() ? "?" + incomingParams.toString() : "");
      var targetParams = new URLSearchParams(incomingParams);
      targetParams.set("category", "panties");
      targetParams.set("pretty", prettyUrl);
      window.location.replace("../../category.html?" + targetParams.toString());
    }());
  </script>
</head>
<body></body>
</html>
